# OpenMaterica Known Anomalies Registry
#
# Schema: the anomaly records are identical to MADDENING's (MADDENING DOCUMENTATION_ARCHITECTURE.md
# section 9.7). Do not add fields; name affected components as schema:<API>, reader:<function>,
# method:<OMAT-MTH id>, model:<family identifier> or data:<MAT id> (CONTRIBUTING.md).
# Checked in CI, in its first job on every run, by scripts/check_anomalies.py, which stands in for
# MADDENING's validator:
#   python -m maddening.compliance check-anomalies docs/validation/known_anomalies.yaml \
#     --prefix OMAT-ANO- --version-field materica_version
# The version field is materica_version, which MADDENING's validator accepts from MADDENING 0.4.0. Its
# library function can skip resolving components (validate_anomaly_registry(..., resolve_references=False),
# since 0.4.0) and MADDENING's own script has --no-resolve, but the packaged command above cannot skip it: it
# reads each affected_components entry as an importable Python name, which schema:<API> and the others are
# not (DOCUMENTATION_ARCHITECTURE.md section 8.1). The gate installs nothing, and installing MADDENING needs
# Python 3.12 or later where OpenMaterica supports 3.11. The stand-in also checks more than MADDENING's
# library does (an identifier's three digits, the component kinds, affected_versions required and a PEP 440
# specifier set, every field a string), so a switch would run MADDENING's validator beside it.
# Limits: the stand-in does not check what MADDENING's own script checks of a registry that has entries: the
# order of affected_versions (below) and its status against the entry's; that a "resolved" entry has a
# resolution_version, and a "resolved" or "partially_resolved" one a verification; that each verification
# names a real test; and that identifiers run on without a gap. They are left for the pull request that adds
# the first entry.
#
# Severity definitions, applied to data: DOCUMENTATION_ARCHITECTURE.md section 8.2.
# affected_versions: a PEP 440 specifier set, as in MADDENING (">=FIRST" while reachable,
# ">=FIRST, <FIX" once fixed, "none" for a defect no release carried).
#
# materica_version is the version of the tree this registry ships in, the package's in pyproject.toml;
# the check fails where the two differ, so a version's bump updates it.

schema_version: "1.0"
materica_version: "0.1.0.dev4"
generated_date: "2026-10-27"

anomalies: []
