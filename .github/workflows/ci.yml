# Why CI is shaped this way. The repository is public, so GitHub's standard runners cost nothing; what matters is
# how fast a change gets its answer. So a first job (gate) finds what a change touched, and the other jobs skip
# at job level when nothing relevant changed: a skipped job counts as passed for a required check, while a
# workflow skipped by `paths` would leave the check pending. A docs-only pull request runs the gate alone, which
# also checks sign-offs, that nothing private is named and the known-anomalies registry, and one that changes
# only the site the gate and the site job. A merge to main runs every job, whatever it changed, and the
# `result` job fails where a job the gate asked for did not succeed.
# Every pull request tests all five Pythons, in parallel, so breadth costs no waiting. The
# per-push critical path is the longest of the test, control and Hypothesis jobs. Keep it short: work that
# would lengthen the longest job runs beside it as a job of its own (the generated files), a shard (the
# property tests) or a part of equal time (`--partition`, tests/partition.py: the test and control jobs, and the
# Hypothesis job's four longest shards), so that a push waits for the longest job only. The Hypothesis job at the
# `ci` profile runs on every change but one confined to paths no part of it reads (the gate lists them). The
# `deep` profile and Atheris fuzzing, slow by design, run weekly and on manual runs only.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # Mondays, 04:23 UTC
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds of fuzzing for each of the three Atheris targets
        type: number
        default: 300
      fuzz_only:
        description: Run the fuzz job alone
        type: boolean
        default: false

# A newer push to a pull request cancels the run of the older one, which nobody will read. Every other run has
# a group of its own, so that none is ever cancelled or replaced: each merge to main is tested whole, and the
# weekly run never meets a push. tests/unit/test_ci_workflows.py evaluates both settings for each event.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"

# Every step of every workflow here runs under bash with `-eo pipefail` (GitHub's `shell: bash`), so that a
# command that fails inside a pipe fails its step; without it GitHub runs `bash -e`, where only a pipe's last
# command counts. tests/unit/test_ci_workflows.py holds each workflow to it, and runs the steps it tests so.
defaults:
  run:
    shell: bash

# Every job of every workflow here runs on ubuntu-24.04, never ubuntu-latest, which GitHub moves to Ubuntu
# 26.04 between 2026-10-19 and 2026-11-19 (its changelog of 2026-09-17): a label that moves changes the
# system Python and the tools under a run whose code did not change. A newer image is a deliberate change,
# made in every workflow at once and in tests/unit/test_ci_workflows.py, which holds each job to it.
jobs:
  gate:
    name: sign-off and changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      hypothesis: ${{ steps.paths.outputs.hypothesis }}
      site: ${{ steps.paths.outputs.site }}
      commits: ${{ steps.paths.outputs.commits }}
      site_commits: ${{ steps.paths.outputs.site_commits }}
      workflow_blob: ${{ steps.paths.outputs.workflow_blob }}
      per_commit_max_parallel: ${{ steps.cap.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The per-commit jobs' cap, `max-parallel` of `commit` and `site_commit` below, is the repository variable
      # PER_COMMIT_MAX_PARALLEL, or 6 where it is unset (maintainer, 2026-10-17). GitHub documents no bound on
      # `max-parallel`, nor what it does with 0, a negative number or a fraction, so this step checks the value
      # on every run and fails where it is not a whole number from 1 to 60: the capped jobs, which need the
      # gate, never start, and the result fails. It writes the value it took as the gate's output
      # `per_commit_max_parallel`, which those jobs parse and which is the only place they read it: a value
      # changed after the check does not reach them (.github/workflows/README.md says how re-runs read it). The
      # digits
      # are listed, not a range: in a locale such as en_US.UTF-8, bash's `[1-9]` takes other scripts' digits
      # too (`٦`, `６`, `²`), which fromJSON cannot parse. The refusal prints the value escaped (`%q`), so that
      # a line break in it starts no workflow command. repeat.yml's request job checks its own cap with the
      # same script. .github/workflows/README.md says when to raise or lower it.
      - name: The cap of jobs at once is a whole number from 1 to 60
        id: cap
        env:
          VARIABLE: PER_COMMIT_MAX_PARALLEL
          MAX_PARALLEL: ${{ vars.PER_COMMIT_MAX_PARALLEL || '6' }}
        run: |
          if [[ ! "$MAX_PARALLEL" =~ ^([123456789]|[12345][0123456789]|60)$ ]]; then
            printf -v shown '%q' "$MAX_PARALLEL"
            echo "::error title=Runner cap::the repository variable $VARIABLE is $shown, not a whole number from 1 to 60: set it to one, or delete it for the workflow's default"
            exit 1
          fi
          echo "max_parallel=$MAX_PARALLEL" >> "$GITHUB_OUTPUT"
          echo "$VARIABLE: at most $MAX_PARALLEL jobs at once"

      - name: Every commit signed off (CONTRIBUTING constraint 1)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_signoff.py "$BASE" "$HEAD"

      # The tracked files, the messages of the commits this event brings (on a push, all of main's when the
      # commit before it is unknown), and a pull request's branch name, public from its push. Without the
      # secret, as on a fork, the private paths are still checked and the names are not, with a warning
      # (CONTRIBUTING, "Confidentiality").
      - name: No private name or path in the tracked files or the commit messages
        env:
          CONFIDENTIAL_SCAN_KEY: ${{ secrets.CONFIDENTIAL_SCAN_KEY }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ -z "$CONFIDENTIAL_SCAN_KEY" ]; then
            echo "::warning::CONFIDENTIAL_SCAN_KEY is not set, so the private names were not checked; the private paths were"
          fi
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push)
              range="$PUSH_AFTER"
              if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then range="$PUSH_BEFORE..$PUSH_AFTER"; fi ;;
            *) range="" ;;
          esac
          python3 scripts/check_confidential.py ${range:+--messages "$range"} ${HEAD_REF:+--ref-name "$HEAD_REF"}

      # The known-anomalies registry against MADDENING's record schema, and its version against the package's,
      # on every run whatever the change touches, so that the step below may call the registry documentation.
      # scripts/check_anomalies.py stands in for MADDENING's validator (the registry's header says why), on the
      # standard library alone, as this job installs nothing.
      - name: The known-anomalies registry keeps MADDENING's record schema and the package's version
        run: python3 scripts/check_anomalies.py

      # Its outputs decide which jobs run: `code` the static, generated-files, test and control jobs,
      # `hypothesis` the Hypothesis job, `site` the site job, `commits`, a JSON list, the commits the
      # per-commit job checks, and `site_commits` those whose site alone the site-commit job checks.
      # tests/unit/test_ci_workflows.py runs this step and holds each job's `if` to them.
      # The gate fails closed: it lists the paths that are documentation only, which no test, script, generator,
      # build or workflow reads, and counts every other path as code, a new one included. Some documents are
      # code: README.md and LICENSE go into the wheel, typings/ to the type checkers, and docs/specification/,
      # the architecture draft and the documentation plan to the spec-sync tests. tests/unit/test_ci_workflows.py
      # checks that no test or script names a path listed here. A Python file is code wherever it sits, a listed
      # directory included (`python_paths`): ruff, run without paths, reads every file pyproject.toml's
      # `include` matches, which the same tests hold to this pattern.
      # The site's own paths, site/ and assets/, are not code either (maintainer, 2026-10-17): the Pages
      # workflow and the site job read them, and no test, so a change to them alone runs the site job and not
      # the code's. tests/unit/test_ci_workflows.py checks that no test or script names one but the site check
      # and the few it lists, each with its reason. The site job runs on every change but one to documentation
      # alone, since what it checks also reads the README, the published schemas and the freeze manifest
      # (tests/spec_sync/released_schemas.json, which decides which version's page carries the draft note), which
      # are code.
      # The Hypothesis job's gate fails closed in the same way (maintainer, 2026-10-17): beside the documentation,
      # it lists the paths that no part of that job reads, neither a module its property tests load or import,
      # nor a path such a module names, nor the job's steps, its build (pyproject.toml's readme and licence, the
      # lock file, src/) or this workflow, and every other path runs the job, a new one and any test included.
      # tests/unit/test_ci_workflows.py checks each of those against the paths listed here.
      - name: Changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          FUZZ_ONLY: ${{ inputs.fuzz_only }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          site_paths='site/.+|assets/.+'
          docs_paths='CHANGELOG\.md|CLAUDE\.md|CONTRIBUTING\.md|SECURITY\.md|docs/regulatory/.+|docs/validation/.+|\.github/ISSUE_TEMPLATE/.+|\.github/pull_request_template\.md'
          python_paths='.*\.pyi?'
          hypothesis_free='site/.+|assets/.+|design/.+|DOCUMENTATION_ARCHITECTURE\.md|typings/.+|scripts/(check_claims|check_confidential|check_signoff|check_site|check_wheel|freeze_schema|gen_shapes|schema_index)\.py|scripts/README\.md|scripts/confidential_digests\.txt|scripts/pre-push|\.github/workflows/(claims|pages|release)\.yml|\.github/workflows/README\.md'
          commits=()
          site_commits=()
          workflow_blob=
          if [ "$FUZZ_ONLY" = true ]; then
            # A manual run of the fuzz job alone.
            code=false
            hypothesis=false
            site=false
          elif [ "$EVENT" = pull_request ]; then
            # Both paths of a file moved, which git would otherwise give as a rename, by where it went alone:
            # a module moved into a documentation path is a change to code.
            changed=$(git diff --no-renames --name-only "$PR_BASE...$PR_HEAD")
            # A pull request names its own files: printed with workflow commands stopped, so that a name
            # beginning with `::` is printed, not obeyed.
            stop=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
            echo "::stop-commands::$stop"
            printf '%s\n' "$changed"
            echo "::$stop::"
            # Documentation or the site's alone when there are paths, none a Python file, and each is listed: a
            # diff that names none is code.
            if [ -n "$changed" ] && ! grep -qxE "$python_paths" <<< "$changed" && ! grep -qvxE "$docs_paths|$site_paths" <<< "$changed"; then
              code=false
            else
              code=true
            fi
            if [ -n "$changed" ] && ! grep -qxE "$python_paths" <<< "$changed" && ! grep -qvxE "$docs_paths" <<< "$changed"; then
              site=false
            else
              site=true
            fi
            if [ -n "$changed" ] && ! grep -qvxE "$docs_paths|$hypothesis_free" <<< "$changed"; then
              hypothesis=false
            else
              hypothesis=true
            fi
            # Each commit but the head, oldest first, for the per-commit job, but one that changes documentation
            # or the site alone: its tree is its parent's but for paths no test reads, and its parent is listed
            # too, or is the base. One that changes the site, beside documentation or not, is listed for the
            # site-commit job instead, which runs the site job's checks on it. A commit that changes no path is
            # listed, as a diff that names none is code: grep reads its empty diff as one empty line, which no
            # pattern lists. A force-push lists the commits the branch holds now. The list is taken apart from
            # the loop, so that a failure of git fails the step rather than list nothing.
            revisions=$(git rev-list --reverse "$PR_BASE..$PR_HEAD")
            for sha in $revisions; do
              [ "$sha" != "$PR_HEAD" ] || continue
              own=$(git diff --no-renames --name-only "$sha^" "$sha")
              if grep -qxE "$python_paths" <<< "$own" || grep -qvxE "$docs_paths|$site_paths" <<< "$own"; then
                commits+=("$sha")
              elif grep -qvxE "$docs_paths" <<< "$own"; then
                site_commits+=("$sha")
              fi
            done
            echo "${#commits[@]} commits before the head to check on their own, ${#site_commits[@]} for the site alone"
            # A matrix holds at most 256 jobs, and a run that left some out would pass without them.
            for listed in "${#commits[@]}" "${#site_commits[@]}"; do
              if [ "$listed" -gt 256 ]; then
                echo "::error::$listed commits to check on their own in one job, more than the 256 jobs of a matrix: split the pull request"
                exit 1
              fi
            done
            # This workflow as it runs (the merge commit's), which the per-commit job's record of a passed tree
            # names, so that a pass under other checks is never taken for one under these.
            workflow_blob=$(git hash-object .github/workflows/ci.yml)
          else
            # A merge to main, the weekly run and a manual run test everything, whatever changed.
            code=true
            hypothesis=true
            site=true
          fi
          {
            echo "code=$code"
            echo "hypothesis=$hypothesis"
            echo "site=$site"
            echo "commits=$(python3 -c 'import json, sys; print(json.dumps(sys.argv[1:]))' "${commits[@]}")"
            echo "site_commits=$(python3 -c 'import json, sys; print(json.dumps(sys.argv[1:]))' "${site_commits[@]}")"
            echo "workflow_blob=$workflow_blob"
          } >> "$GITHUB_OUTPUT"

  static:
    name: lint, types, wheel
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Cache pyright's Node package
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pyright-python
          key: pyright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pyright

      - run: uv build
      - name: The wheel holds py.typed, the conformance data byte for byte, and its PEP 639 licence
        run: uv run python scripts/check_wheel.py dist/*.whl
      - name: A consumer's code type-checks against the installed wheel
        run: |
          uv venv "$RUNNER_TEMP/consumer"
          uv pip install --python "$RUNNER_TEMP/consumer/bin/python" dist/*.whl
          mkdir "$RUNNER_TEMP/snippet"
          cp tests/typing/consumer_snippet.py "$RUNNER_TEMP/snippet/"
          cd "$RUNNER_TEMP/snippet"
          uv run --project "$GITHUB_WORKSPACE" mypy --strict --python-executable "$RUNNER_TEMP/consumer/bin/python" consumer_snippet.py
          uv run --project "$GITHUB_WORKSPACE" pyright --pythonpath "$RUNNER_TEMP/consumer/bin/python" consumer_snippet.py
      - name: Control, both checkers refuse the snippet once a result's shape is not read-only
        run: |
          stub="$("$RUNNER_TEMP/consumer/bin/python" -c 'import materica, pathlib; print(pathlib.Path(materica.__file__).parent / "shapes.pyi")')"
          cp "$stub" "$RUNNER_TEMP/shapes.pyi"
          sed -i -E 's/: ReadOnly\[(.*)\]$/: \1/' "$stub"
          cd "$RUNNER_TEMP/snippet"
          if uv run --project "$GITHUB_WORKSPACE" mypy --strict --python-executable "$RUNNER_TEMP/consumer/bin/python" consumer_snippet.py; then
            echo "::error::mypy accepted a write into a result that is not read-only, so the check above cannot fail"
            exit 1
          fi
          if uv run --project "$GITHUB_WORKSPACE" pyright --pythonpath "$RUNNER_TEMP/consumer/bin/python" consumer_snippet.py; then
            echo "::error::pyright accepted a write into a result that is not read-only, so the check above cannot fail"
            exit 1
          fi
          cp "$RUNNER_TEMP/shapes.pyi" "$stub"
      - name: Control, the same check fails once py.typed is gone
        run: |
          rm "$("$RUNNER_TEMP/consumer/bin/python" -c 'import materica, pathlib; print(pathlib.Path(materica.__file__).parent / "py.typed")')"
          cd "$RUNNER_TEMP/snippet"
          if uv run --project "$GITHUB_WORKSPACE" mypy --strict --python-executable "$RUNNER_TEMP/consumer/bin/python" consumer_snippet.py; then
            echo "::error::the snippet type-checked without py.typed, so the check above cannot fail"
            exit 1
          fi

  generated:
    name: generated files
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # datamodel-code-generator, which gen_shapes.py runs, does not run on Python 3.15.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # Each regenerates its files in memory and fails where one on disk differs (CONTRIBUTING, "Changing the
      # schema"): the vocabulary from the specification's tables, the reader schema and the shapes from the
      # writer schemas, and the property README's kill counts from `tests/property/kill_points.json`, which
      # also fails on a kill after the 500th example (the margin guard).
      - run: uv run python scripts/gen_vocabulary.py --check
      - run: uv run python scripts/gen_reader_schema.py --check
      - run: uv run python scripts/gen_shapes.py --check
      - run: uv run python scripts/gen_kill_counts.py --check

  tests:
    name: tests (Python ${{ matrix.python }}, part ${{ matrix.part }} of 2)
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Measured on CI with the mutant searches and the audit controls in this job: at S2a-1's head 2.1 to 4.1
    # minutes; at S2a-2's, 6.1 to 8.7 minutes with 3.11 past 10, where its timeout cancelled it (run 38818013140,
    # 2026-10-15), then 8.7 to 13.9 minutes, 3.11 the slowest (run 38859424951, 2026-10-16). Without them, in the
    # first run with the controls job apart, 3.8 to 7.0 minutes, 3.14 and 3.15 the slowest (run 38954710616,
    # 2026-10-16). A hosted runner here is 1.6 to 4 times slower than a local core, and varies from run to run, so
    # the timeout is set well above the slowest measured job. With S2a-3 and its fix round, the whole suite, the
    # mutant searches and the audit controls among it, took 314 s on four local workers (Python 3.15,
    # 2026-10-16), unmeasured on CI.
    timeout-minutes: 40
    # The same minutes, from which the pytest step's interrupt is set (below).
    env:
      JOB_MINUTES: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # Two parts of about equal time (`--partition`, tests/partition.py), side by side: each Python's tests
        # in the one job were the longest of the head's jobs once the controls were split. The parts together
        # hold every test once, which tests/unit/test_ci_workflows.py checks on the tests it collects.
        part: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # Every test but the mutant searches and the audit controls, which the next job runs; the property tests
      # at the `dev` profile: Python's json differs between versions, so the properties run on each; their
      # depth is the Hypothesis job's. A worker per vCPU, as in that job.
      # Each pytest command runs under `timeout --foreground --signal=INT`, three minutes before its job's limit
      # (maintainer, 2026-10-17; all but the fuzz job's, which write no report and start late among its steps).
      # `timeout` sends pytest one SIGINT, as Ctrl-C does to a process, so that pytest stops, writes the report
      # of the tests that finished, and fails the step (`timeout` exits 124); the durations steps then read that
      # report. `--foreground` is what makes it one: `timeout` otherwise signals its child and then its whole
      # process group, so that pytest-xdist's controller met a second SIGINT, and when that came while it
      # unwound the first, inside `threading.Condition.wait` under `queue.get`, Python raised `RuntimeError:
      # release unlocked lock` and pytest ended in an internal error: a report with a case no test owns, which
      # the durations step refuses (8 of 200 runs of one test on Python 3.15 on CI, 1 of 200 on 3.13; run
      # 39067401383). With one SIGINT the workers get none; the controller's teardown ends them, and execnet
      # interrupts one that has not ended after about 5 s, so the report is written about 5 s after the limit.
      # Give `timeout` no `--kill-after` under about 15 s: it kills the controller during that teardown, and
      # the report is lost. GitHub's own timeout would interrupt, then end, the step's shell
      # and not pytest, which writes its report only as its run ends, so a job cancelled that way has none (read
      # from the runner's code, and seen in a local run sent the same signals, 2026-10-16). uv runs `timeout`,
      # and so stays outside it: under `timeout ... uv run pytest` (without `--foreground`), uv passed pytest a
      # second SIGINT during its shutdown, which then failed with a traceback and, in 4 of 7 local runs, no
      # report; run this way, 10 of 10 wrote it (uv 0.13.0 and 0.11.15, 2026-10-17). `JOB_MINUTES` repeats the
      # job's `timeout-minutes`, which no step can read, and tests/unit/test_ci_workflows.py holds the two equal
      # for every event and combination.
      - id: pytest
        run: >-
          uv run timeout --foreground --signal=INT "$((JOB_MINUTES - 3))m"
          pytest -n auto --dist worksteal --property-controls none --partition ${{ matrix.part }}/2
          --junitxml="$RUNNER_TEMP/durations.xml"
        env:
          MATERICA_HYPOTHESIS_PROFILE: dev
          # The trace test of scripts/pre_review.py's tables (tests/unit/test_pre_review.py) runs the whole suite
          # once inside one test, about a minute of wall time and three of CPU locally, and is skipped unless this is
          # `1`. It runs here on Python 3.15 alone, so once per CI run and not in every job that runs tests/unit.
          # 3.15 is the Python of the project's own environment, in which a builder runs the same test, and the
          # newest, where a change to the audit events or the import system that the trace reads would show first.
          # tests/unit/test_ci_workflows.py holds that exactly one job of this workflow sets it, and collects each
          # part that runs with it to hold that, on every event, those parts run the trace test once.
          MATERICA_TRACE_SELECTION: ${{ matrix.python == '3.15' && '1' || '' }}
      # Where the time went, on the run's page, and the report kept for later runs to compare (no time fails
      # the job): scripts/report_test_durations.py. Whenever pytest ran, passed, failed, was interrupted before
      # the job's timeout, or was cancelled, and not where a failed checkout or setup skipped it. A run cancelled
      # from outside, or one that GitHub's timeout ends after all, has no report: the durations step then says
      # there is none, and the pytest step's log shows how far the run got.
      - name: Test durations
        if: always() && steps.pytest.outcome != 'skipped'
        env:
          TITLE: "Test durations: tests, Python ${{ matrix.python }}, part ${{ matrix.part }} of 2"
        run: uv run python scripts/report_test_durations.py "$RUNNER_TEMP/durations.xml" --title "$TITLE"
      - name: Keep the durations
        if: always() && steps.pytest.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durations-tests-${{ matrix.python }}-${{ matrix.part }}of2
          path: ${{ runner.temp }}/durations.xml
          if-no-files-found: error
          retention-days: 90

  controls:
    name: mutant searches and audit controls (Python ${{ matrix.python }}, part ${{ matrix.part }} of ${{ matrix.parts }})
    # The mutant searches and the audit controls show that each property and each feature audit can fail
    # (tests/README.md, "Every check can fail"). They run at the `ci` profile's examples whatever the profile,
    # so on each Python they cost about as much as all its other tests. They run on the supported range's
    # ends, the oldest Python and the newest, which bracket the versions between (maintainer, 2026-10-16), and
    # in a job of their own beside each end's test job, so that neither job is the longest: 3.11's was. The
    # Hypothesis job's shards run the mutant searches too. tests/unit/test_ci_workflows.py checks that the two
    # jobs together leave nothing out on 3.11 and 3.15, and only these tests on the Pythons between.
    # The audit controls are most of the work (82 percent of the CPU time, 25 to 280 s a test), and 3.11 took
    # 12 to 25 minutes in one job, the longest of the run (CI runs of 2026-10-19). So the tests are split into
    # parts of about equal time that run side by side (`--partition`, tests/partition.py): four on 3.11, which
    # is the slower interpreter, two on 3.15. The parts together hold every test once, which
    # tests/unit/test_ci_workflows.py checks on the tests CI's matrix selects. The kill points are checked after
    # them, in the `kill_points` job, on all the parts' reports at once.
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # A part took at most 6 minutes on the first run of the parts, against the 12 to 25 of one job above. 40 is
    # the test job's timeout, kept until more runs of the parts are measured.
    timeout-minutes: 40
    env:
      JOB_MINUTES: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]
        part: [1, 2, 3, 4]
        # 3.15 has two parts, so its third and fourth are left out; `parts` is how many a Python has.
        exclude:
          - { python: "3.15", part: 3 }
          - { python: "3.15", part: 4 }
        include:
          - { python: "3.11", parts: 4 }
          - { python: "3.15", parts: 2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # The mutant searches and the audit controls alone (`--property-controls` in tests/conftest.py), under the
      # same profile as the test job.
      - id: pytest
        run: >-
          uv run timeout --foreground --signal=INT "$((JOB_MINUTES - 3))m"
          pytest -n auto --dist worksteal --property-controls only --partition ${{ matrix.part }}/${{ matrix.parts }}
          --junitxml="$RUNNER_TEMP/durations.xml"
        env:
          MATERICA_HYPOTHESIS_PROFILE: dev
      - name: Test durations
        if: always() && steps.pytest.outcome != 'skipped'
        env:
          TITLE: "Test durations: mutant searches and audit controls, Python ${{ matrix.python }}, part ${{ matrix.part }} of ${{ matrix.parts }}"
        run: uv run python scripts/report_test_durations.py "$RUNNER_TEMP/durations.xml" --title "$TITLE"
      # The report is kept whenever pytest ran, for the durations and for the `kill_points` job, which reads all
      # of a Python's parts' reports together.
      - name: Keep the durations
        if: always() && steps.pytest.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durations-controls-${{ matrix.python }}-${{ matrix.part }}of${{ matrix.parts }}
          path: ${{ runner.temp }}/durations.xml
          if-no-files-found: error
          retention-days: 90

  kill_points:
    name: kill points (Python ${{ matrix.python }})
    # Each search's kill point, as the reports give it, is the one `tests/property/kill_points.json` records,
    # every recorded group and search ran and recorded its kill, and every row of the property README's tables
    # names one that ran: the README's counts are written from that file, so this holds them to the code at the
    # head. A search's kill does not depend on the profile or the Python (scripts/gen_kill_counts.py). It reads
    # the reports of all the parts of a Python's `controls` jobs together, as the one report of every search it
    # read before the jobs were split, and not with `--partial`: a search that ran in no part is a recorded
    # group missing from the run, which fails. The reports are counted as well, so that a part whose report is
    # missing is named as that and not as the searches it held.
    needs: [gate, controls]
    if: needs.gate.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]
        include:
          - { python: "3.11", parts: 4 }
          - { python: "3.15", parts: 2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Fetch the reports of the parts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: durations-controls-${{ matrix.python }}-*
          path: ${{ runner.temp }}/controls
      - name: Each kill point is the recorded one
        env:
          PARTS: ${{ matrix.parts }}
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/controls/*/durations.xml)
          if [ "${#reports[@]}" -ne "$PARTS" ]; then
            echo "::error::${#reports[@]} reports of the controls' parts, not the $PARTS that ran"
            exit 1
          fi
          uv run python scripts/gen_kill_counts.py --against "${reports[@]}"

  hypothesis:
    name: hypothesis (${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'deep' || 'ci' }}, ${{ matrix.shard }})
    needs: gate
    if: needs.gate.outputs.hypothesis == 'true'
    runs-on: ubuntu-24.04
    # Each shard's timeout, by profile. The pytest step is interrupted three minutes before it (below), and
    # tests/unit/test_ci_workflows.py holds that interrupt at twice the shard's slowest run measured on CI
    # (`MEASURED_ON_CI`), so that a runner half as fast still finishes. GitHub ends a job on a hosted runner at
    # 360 minutes.
    # `deep`: at least twice the shard's slowest job measured, with the interrupt's three minutes to spare.
    # Measured on CI in three dispatched `deep` runs, each job's time on the runner (started to completed, its
    # set-up included), in minutes: run 39002750375 (2026-10-17, the five shards there then, each whole), run
    # 39540221119 (2026-10-21, main at 76907779) and run 39553647007 (2026-10-21, at 7288ebd5, whose tree main
    # holds at bb2523e8, with the four audit controls of HP12's floors held at `deep` alone in `relations`, 10.4
    # to 21.0 minutes each by its durations reports); and records in a fourth, run 39578840767 (2026-10-21, main
    # at 0b9f6a5e), where pytest ran the whole shard in 3,844 s, 99 passed and 1 failed, the failure a strategy
    # that could not build its case (HP13's `source_range_disjoint`), not time. A shard run in parts takes its
    # slowest part's time, both parts the one timeout: the weights split the parts by their times at `ci`, and
    # at `deep` two parts can differ, as agreement's did. Each shard's times in that order, then the least
    # timeout the rule allows (twice the slowest, and three) and its timeout:
    #   writer 63.6, 67.4, 61.4: 137.9, 180; conditions (not in the first) 62.4, 49.1: 127.8, 180;
    #   agreement 47.0 whole, then its parts 49.8 and 77.3, 25.4 and 76.1: 157.6, 360;
    #   relations (not in the first), its parts 50.3 and 49.6, 58.2 and 65.2: 133.4, 345;
    #   alternatives (not in the first), its parts 22.0 and 20.6, 38.7 and 32.2, and with S4d's properties
    #   about 52.6 and 40.9 by estimate (below): 108.2, 110;
    #   build (in none), its parts about 29.1 each by estimate (below): 61.2, 65;
    #   records 31.4, 37.2, 50.8, 64.3: 131.5, 135; json 14.1, 22.6, 23.9: 50.7, 55;
    #   step 8's mutants 1.6, 0.6, 0.7: 6.1, 45 (the default, which a shard not yet measured at `deep` has too).
    # records and json had fallen below the rule and are raised to it, rounded up to a multiple of five: records
    # twice, to 105 at 50.8 and to 135 at 64.3. The others are kept, not lowered to the rule: the same code has
    # run at least 2.7 times as long on one runner as on another (the writer shard at `ci`, below: 11 minutes,
    # and past 30), and three runs, two of them on one morning, do not bound that. Lowering them is the
    # maintainer's call. S4d's properties (HP39's two parts and HP40) take 175 and 110 s of the alternatives
    # parts' test time at `ci` locally (2026-10-22, against 470 and 421 in all); ten times that at `deep`, on a
    # runner 1.9 times slower than the laptop (main's parts at `ci`: 121 and 114 s locally, 197 and 218 on CI),
    # shared by four workers, adds about 13.9 and 8.7 minutes to the parts' 38.7 and 32.2. The shard's timeout
    # rises from 90 to 110 by that estimate, which the first `deep` run measures. S7a's build shard has not run
    # at `deep`: on CI at `ci`, HP43 to HP46's properties took 390.9 s of test time (run 40321465190) and HP41
    # and HP42's 997.5 (run 40384724598; 682.5 in run 40427835712), and the two pieces' mutant searches, which
    # run at `ci`'s examples whatever the profile, 73.2; ten times the properties and the searches once, shared
    # by four workers, is about 58.2 minutes whole (44.9 by the later run), past the default 45, and 29.1 in
    # each of its two parts. Its timeout is 65 by that estimate, which the first `deep` run measures.
    # `ci`: each well above its shard's slowest run measured on CI, since a hosted runner has taken 1.6 to 4
    # times as long as this machine and varies from run to run: agreement 5.9 minutes, writer 5.2, records 2.5,
    # json and step 8's mutants 1.6 (run 39002323592, 2026-10-17); relations 7.4 and conditions 5.1 (run
    # 39039695416, 2026-10-17); and, in pytest's wall time, relations 9.0, agreement 7.1 and alternatives 6.6
    # (run 39390324975, 2026-10-20; the matrix's comment). The writer shard took 17 minutes at S2a-1's head (run
    # 38726723407, 2026-10-15) and passed 30 at S2a-2's (run 38818013140), where its timeout cancelled it, then
    # took 11 at the same code (run 38859424951), though locally its four workers took 8.1 and 7.1 minutes at
    # those heads (Python 3.15): the runner, not the code, made the difference. Its `ci` timeout is 75.
    timeout-minutes: >-
      ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && ((matrix.shard == 'writer' || matrix.shard == 'conditions') && 180
      || startsWith(matrix.shard, 'relations') && 345
      || startsWith(matrix.shard, 'agreement') && 360
      || startsWith(matrix.shard, 'alternatives') && 110
      || startsWith(matrix.shard, 'build') && 65
      || matrix.shard == 'records' && 135 || matrix.shard == 'json' && 55 || 45)
      || (matrix.shard == 'writer' && 75 || (matrix.shard == 'conditions' || startsWith(matrix.shard, 'relations')) && 30
      || startsWith(matrix.shard, 'agreement') && 45 || 20) }}
    strategy:
      fail-fast: false
      matrix:
        # Nine shards (`SHARDS` in tests/conftest.py): the JSON reader, RFC 8785, the hash and the table
        # evaluator; the envelope checks, versions and the read; the writer schema's value fields; the two JSON
        # Schema libraries' agreement, whose python-jsonschema validations make it the longest; step 8's mutant
        # searches, which were most of the records shard's time; steps 9 and 10's properties and the result's,
        # with their mutant searches; the read's relations (HP12, the agreement with the reference model,
        # HP4, HP10 and the information-monotonicity relations), with theirs; S4a's step 7 over alternatives
        # (HP27 to HP29), with theirs; and S7a's build check (HP41 to HP46), with theirs.
        # The four longest, `agreement`, `relations`, `alternatives` and `build`, each run as two jobs side by side,
        # `agreement_1of2` and `agreement_2of2` (`--shard`, tests/partition.py): the shard's tests in two parts of
        # about equal time, which together hold every one once (tests/unit/test_ci_workflows.py checks it on the
        # tests they collect). At `ci`, on CI, `relations` took 9.0 minutes, `agreement` 7.1 and `alternatives`
        # 6.6 (run 39390324975, 2026-10-20, the pytest run's wall time in each durations report; the run before,
        # 39335066688, took 7.3 and 5.9 for the first two), the longest of the Hypothesis job's shards. The times
        # by test of run 39390324975, summed over each half's tests, are 1,038 and 1,039 s for `relations`, 498
        # and 498 s for `agreement` and 680 and 678 s for `alternatives`, where the longest single test is 185 s.
        # `build` holds both S7a pieces' properties and searches: on CI at `ci` they took 2.1 minutes (HP43 to
        # HP46's, run 40321465190) and 4.6 (HP41 and HP42's, run 40384724598; 3.2 in run 40427835712) in pytest's
        # wall time, run apart, so 6.7 together, past a third of the shard's 20-minute timeout (5.3 by the later
        # run), and at `deep` about 58.2 minutes whole by estimate, past its default 45 (above).
        shard: [json, records, writer, agreement_1of2, agreement_2of2, step8_mutants, conditions, relations_1of2, relations_2of2, alternatives_1of2, alternatives_2of2, build_1of2, build_2of2]
    env:
      MATERICA_HYPOTHESIS_PROFILE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'deep' || 'ci' }}
      # The job's `timeout-minutes`, as above, from which the pytest step's interrupt is set.
      JOB_MINUTES: >-
        ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        && ((matrix.shard == 'writer' || matrix.shard == 'conditions') && 180
        || startsWith(matrix.shard, 'relations') && 345
        || startsWith(matrix.shard, 'agreement') && 360
        || startsWith(matrix.shard, 'alternatives') && 110
        || startsWith(matrix.shard, 'build') && 65
        || matrix.shard == 'records' && 135 || matrix.shard == 'json' && 55 || 45)
        || (matrix.shard == 'writer' && 75 || (matrix.shard == 'conditions' || startsWith(matrix.shard, 'relations')) && 30
        || startsWith(matrix.shard, 'agreement') && 45 || 20) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The newest Python, because it ran the shards fastest, locally: at the `ci` profile, two workers each, the
      # json shard took 39 to 48 s on 3.15 and 53 s on 3.11 (measured 2026-10-14); the records shard took 98 s
      # on 3.15 (2026-10-15). Every Python runs the properties at `dev`.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # The example database, so that an example that failed once is replayed first. Cache entries are
      # immutable, so each run saves under its own key and restores the latest; it saves even when the run
      # fails, since a failing example is what most needs keeping. Each shard keeps its own, so that one shard's
      # later save never hides an example the other saved.
      # Step 8's mutant searches keep no example database, so their shard restores and saves none; steps 9 and
      # 10's, in the conditions shard, set none either, which the shard's database leaves alone.
      - name: Restore the example database
        if: matrix.shard != 'step8_mutants'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: hypothesis-${{ runner.os }}-${{ matrix.shard }}-
      # A worker per vCPU: minutes are billed by wall time. Work stealing keeps the long properties from finishing
      # last on one worker.
      - name: Property tests and mutants, with the draw-rejection and feature audits (tests/property/conftest.py)
        id: pytest
        run: >-
          uv run timeout --foreground --signal=INT "$((JOB_MINUTES - 3))m"
          pytest tests/property --shard ${{ matrix.shard }} -n auto --dist worksteal
          --hypothesis-show-statistics --junitxml="$RUNNER_TEMP/durations.xml"
      - name: Test durations
        if: always() && steps.pytest.outcome != 'skipped'
        env:
          TITLE: "Test durations: hypothesis (${{ env.MATERICA_HYPOTHESIS_PROFILE }}, ${{ matrix.shard }})"
        run: uv run python scripts/report_test_durations.py "$RUNNER_TEMP/durations.xml" --title "$TITLE"
      - name: Keep the durations
        if: always() && steps.pytest.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durations-hypothesis-${{ matrix.shard }}
          path: ${{ runner.temp }}/durations.xml
          if-no-files-found: error
          retention-days: 90
      - name: Save the example database
        if: always() && matrix.shard != 'step8_mutants'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-${{ matrix.shard }}-${{ github.run_id }}

  site:
    name: the site, staged as Pages stages it
    # A change to site/ or assets/ alone runs no test, mutant search or Hypothesis shard, none of which reads
    # them, and this job in their place (maintainer, 2026-10-17): the site staged exactly as the Pages workflow
    # stages it, its step copied word for word (tests/unit/test_ci_workflows.py holds the two equal), which
    # fails where a file it copies is missing; then scripts/check_site.py on that copy: every local link, image
    # and icon resolves, every page keeps a content security policy that lets nothing load from elsewhere, and
    # the README's images name files of the tree. Seconds long, on the runner's own Python.
    needs: gate
    if: needs.gate.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage site/, with the logo and favicons at its root and the schemas at /schema/
        run: |
          cp -R site "$RUNNER_TEMP/site"
          cp assets/images/logo.png assets/images/favicon/* "$RUNNER_TEMP/site/"
          if [ -d src/materica/schema ]; then
            mkdir "$RUNNER_TEMP/site/schema"
            cp -R src/materica/schema/. "$RUNNER_TEMP/site/schema/"
            python3 scripts/schema_index.py "$RUNNER_TEMP/site/schema"
          fi
      - name: Every local link, image and icon resolves, every page keeps its policy, the README's images exist
        run: python3 scripts/check_site.py "$RUNNER_TEMP/site" --readme README.md

  commit:
    name: commit ${{ matrix.sha }} on its own
    # Every commit of a pull request builds, type-checks, generates and collects on its own before the merge,
    # which CI checks commit by commit: each commit but the head, checked out as it is, gets on Python 3.15
    # alone the fast checks an agent runs on a commit locally, the site job's checks, ruff, mypy and pyright, the
    # wheel and its check, every generator's check and `freeze_schema.py --check`, then the collection of every
    # test and the specification-sync tests (tests/spec_sync); the whole suite runs on the head alone, in the
    # jobs above, every Python and the `ci` profile (maintainer, 2026-10-21). Until then this job ran the whole
    # suite at the `dev` profile as well (maintainer, 2026-10-16), a median of 23.7 minutes, 12 to 28 (CI runs
    # of 2026-10-20 to 2026-10-21, 24 jobs), the longest job of every pull request with earlier commits; in the
    # pull-request runs since it began (2026-10-17), it found a commit that failed alone while the head passed
    # five times, two of them by the checks this job keeps. The gate lists the commits, but those that change
    # documentation alone; a pull request of one commit lists none, and this job is skipped. At most
    # PER_COMMIT_MAX_PARALLEL run at once, a repository variable, 6 where it is unset, as the gate checks it and
    # gives it (.github/workflows/README.md, "Jobs at once").
    # A tree that passed these checks in an earlier run of the same pull request is not checked again. The
    # pass is kept in the cache, under the tree, this workflow's blob and the runner's image version, so that a
    # push that adds commits or rewrites their messages, or one after a run it cancelled, checks only the trees
    # not yet passed; a changed tree, a change to this workflow (the lock file, the tests, uv's version and
    # every action's pin among what the tree and the blob cover), or a new image under the same label (its git
    # and system libraries), is checked again. No test reads the date, the network or the repository's
    # history. The costs: `dev` draws fresh examples each run, and a tree not checked again forgoes another
    # draw; and a pass is only as good as every workflow the pull request's runs used, since a run whose
    # workflow a commit of the pull request edits can save an entry under any key, which a later run of the
    # same pull request trusts. Entries are read by the pull request that wrote them alone.
    needs: gate
    if: needs.gate.outputs.commits != '[]'
    runs-on: ubuntu-24.04
    # Its steps but the suite took a median of 45 s of the job that ran the suite too (87 runs of 2026-10-19 to
    # 2026-10-21); the specification-sync tests, 56 to 144 s of test time in the test jobs' reports (nine runs,
    # every Python), which four workers share, and the collection, about 15 s of a test job's start.
    timeout-minutes: 15
    env:
      JOB_MINUTES: 15
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.gate.outputs.per_commit_max_parallel) }}
      matrix:
        sha: ${{ fromJSON(needs.gate.outputs.commits) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      # ImageVersion is set by GitHub's hosted runners.
      - name: The key of a pass, from the commit's tree, this workflow's blob and the runner's image
        id: tree
        env:
          WORKFLOW_BLOB: ${{ needs.gate.outputs.workflow_blob }}
        run: |
          if [ -z "$WORKFLOW_BLOB" ]; then
            echo "::error::the gate gave no workflow_blob, so a pass under other checks could not be told apart"
            exit 1
          fi
          if [ -z "${ImageVersion:-}" ]; then
            echo "::error::the runner gives no ImageVersion, so a pass on another image could not be told apart"
            exit 1
          fi
          echo "key=commit-passed-$(git rev-parse 'HEAD^{tree}')-$WORKFLOW_BLOB-$ImageVersion" >> "$GITHUB_OUTPUT"
      # Every step after this one is skipped where the tree passed already.
      - name: Whether the tree passed these checks already
        id: passed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/passed
          key: ${{ steps.tree.outputs.key }}
          lookup-only: true
      # The site job's steps, word for word, first: seconds long, on the runner's Python.
      - name: Stage site/, with the logo and favicons at its root and the schemas at /schema/
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          cp -R site "$RUNNER_TEMP/site"
          cp assets/images/logo.png assets/images/favicon/* "$RUNNER_TEMP/site/"
          if [ -d src/materica/schema ]; then
            mkdir "$RUNNER_TEMP/site/schema"
            cp -R src/materica/schema/. "$RUNNER_TEMP/site/schema/"
            python3 scripts/schema_index.py "$RUNNER_TEMP/site/schema"
          fi
      - name: Every local link, image and icon resolves, every page keeps its policy, the README's images exist
        if: steps.passed.outputs.cache-hit != 'true'
        run: python3 scripts/check_site.py "$RUNNER_TEMP/site" --readme README.md
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - if: steps.passed.outputs.cache-hit != 'true'
        run: uv sync --locked
      - name: Cache pyright's Node package
        if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pyright-python
          key: pyright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - if: steps.passed.outputs.cache-hit != 'true'
        run: uv run ruff check
      - if: steps.passed.outputs.cache-hit != 'true'
        run: uv run ruff format --check
      - if: steps.passed.outputs.cache-hit != 'true'
        run: uv run mypy
      - if: steps.passed.outputs.cache-hit != 'true'
        run: uv run pyright
      - if: steps.passed.outputs.cache-hit != 'true'
        run: uv build
      - name: The wheel holds py.typed, the conformance data byte for byte, and its PEP 639 licence
        if: steps.passed.outputs.cache-hit != 'true'
        run: uv run python scripts/check_wheel.py dist/*.whl
      # On Python 3.11, as the generated-files job runs them: datamodel-code-generator, which gen_shapes.py
      # runs, does not run on 3.15. An environment of its own, beside the 3.15 one.
      - name: Every generator's check, on Python 3.11
        if: steps.passed.outputs.cache-hit != 'true'
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/python-3.11
        run: |
          uv sync --locked --python 3.11
          uv run --locked --python 3.11 python scripts/gen_vocabulary.py --check
          uv run --locked --python 3.11 python scripts/gen_reader_schema.py --check
          uv run --locked --python 3.11 python scripts/gen_shapes.py --check
          uv run --locked --python 3.11 python scripts/gen_kill_counts.py --check
      - name: The released schema versions are as frozen
        if: steps.passed.outputs.cache-hit != 'true'
        run: uv run python scripts/freeze_schema.py --check
      # Every test collects, so that a test module that no longer imports, or a test pytest refuses, fails here;
      # then the specification-sync tests, which hold the code, the schemas and the specification's text to each
      # other. Each under the interrupt the tests job's comment describes.
      - name: Every test collects, and the specification-sync tests pass
        id: pytest
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          uv run timeout --foreground --signal=INT "$((JOB_MINUTES - 3))m" pytest --collect-only -q tests
          uv run timeout --foreground --signal=INT "$((JOB_MINUTES - 3))m" pytest tests/spec_sync -n auto --dist worksteal
        env:
          MATERICA_HYPOTHESIS_PROFILE: dev
      - name: Keep the pass of this tree
        id: keep
        if: steps.passed.outputs.cache-hit != 'true'
        run: git rev-parse HEAD > "$RUNNER_TEMP/passed"
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/passed
          key: ${{ steps.tree.outputs.key }}

  site_commit:
    name: commit ${{ matrix.sha }} on its own, the site alone
    # A commit before the head that changes the site alone (beside documentation or not) is not listed for the
    # per-commit job, whose checks read none of it, but here, where the site job's steps run on it as it is:
    # a commit that breaks the site, mended by a later one, would otherwise land unchecked. The per-commit job
    # runs the same steps on each commit it checks. Its cap is the per-commit job's, as the gate gives it.
    needs: gate
    if: needs.gate.outputs.site_commits != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.gate.outputs.per_commit_max_parallel) }}
      matrix:
        sha: ${{ fromJSON(needs.gate.outputs.site_commits) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Stage site/, with the logo and favicons at its root and the schemas at /schema/
        run: |
          cp -R site "$RUNNER_TEMP/site"
          cp assets/images/logo.png assets/images/favicon/* "$RUNNER_TEMP/site/"
          if [ -d src/materica/schema ]; then
            mkdir "$RUNNER_TEMP/site/schema"
            cp -R src/materica/schema/. "$RUNNER_TEMP/site/schema/"
            python3 scripts/schema_index.py "$RUNNER_TEMP/site/schema"
          fi
      - name: Every local link, image and icon resolves, every page keeps its policy, the README's images exist
        run: python3 scripts/check_site.py "$RUNNER_TEMP/site" --readme README.md

  result:
    name: CI result
    # The one check the ruleset on main requires. A matrix job skipped by its `if` reports under another name, so
    # requiring the jobs by name would leave docs-only pull requests waiting. A job skipped by its `if` reports
    # success, so a gate wired wrongly (a renamed step id leaves its outputs empty) would skip every job and pass
    # a check that only looks for failures: this one fails unless every job the gate asked for succeeded.
    needs: [gate, static, generated, tests, controls, kill_points, hypothesis, site, commit, site_commit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every job the gate asked for succeeded, and none failed or was cancelled
        env:
          GATE: ${{ needs.gate.result }}
          CODE: ${{ needs.gate.outputs.code }}
          HYPOTHESIS: ${{ needs.gate.outputs.hypothesis }}
          SITE: ${{ needs.gate.outputs.site }}
          COMMITS: ${{ needs.gate.outputs.commits }}
          SITE_COMMITS: ${{ needs.gate.outputs.site_commits }}
          STATIC_JOB: ${{ needs.static.result }}
          GENERATED_JOB: ${{ needs.generated.result }}
          TESTS_JOB: ${{ needs.tests.result }}
          CONTROLS_JOB: ${{ needs.controls.result }}
          KILL_POINTS_JOB: ${{ needs.kill_points.result }}
          HYPOTHESIS_JOB: ${{ needs.hypothesis.result }}
          SITE_JOB: ${{ needs.site.result }}
          COMMIT_JOB: ${{ needs.commit.result }}
          SITE_COMMIT_JOB: ${{ needs.site_commit.result }}
        run: |
          status=0
          fail() { echo "::error::$1"; status=1; }
          asked() { [ "$2" = success ] || fail "the gate asked for $1, which ended in '$2'"; }
          echo "gate $GATE (code $CODE, hypothesis $HYPOTHESIS, site $SITE, commits $COMMITS, site_commits $SITE_COMMITS); static $STATIC_JOB, generated $GENERATED_JOB, tests $TESTS_JOB, controls $CONTROLS_JOB, kill_points $KILL_POINTS_JOB, hypothesis $HYPOTHESIS_JOB, site $SITE_JOB, commit $COMMIT_JOB, site_commit $SITE_COMMIT_JOB"
          [ "$GATE" = success ] || fail "the gate ended in '$GATE'"
          for output in "code $CODE" "hypothesis $HYPOTHESIS" "site $SITE"; do
            case "${output#* }" in
              true | false) ;;
              *) fail "the gate's output ${output%% *} is '${output#* }', not true or false" ;;
            esac
          done
          if [ "$CODE" = true ]; then
            asked static "$STATIC_JOB"
            asked generated "$GENERATED_JOB"
            asked tests "$TESTS_JOB"
            asked controls "$CONTROLS_JOB"
            asked "the kill points" "$KILL_POINTS_JOB"
          fi
          if [ "$HYPOTHESIS" = true ]; then asked hypothesis "$HYPOTHESIS_JOB"; fi
          if [ "$SITE" = true ]; then asked site "$SITE_JOB"; fi
          # The commits to check on their own: none, or a list, which asks for the per-commit job; and the same
          # for the site-commit job.
          case "$COMMITS" in
            "[]") ;;
            \[\"*\"\]) asked "the commits before the head" "$COMMIT_JOB" ;;
            *) fail "the gate's commits are '$COMMITS', not a list" ;;
          esac
          case "$SITE_COMMITS" in
            "[]") ;;
            \[\"*\"\]) asked "the commits before the head that change the site alone" "$SITE_COMMIT_JOB" ;;
            *) fail "the gate's site_commits are '$SITE_COMMITS', not a list" ;;
          esac
          for result in "$STATIC_JOB" "$GENERATED_JOB" "$TESTS_JOB" "$CONTROLS_JOB" "$KILL_POINTS_JOB" "$HYPOTHESIS_JOB" "$SITE_JOB" "$COMMIT_JOB" "$SITE_COMMIT_JOB"; do
            case "$result" in failure | cancelled) fail "a job ended in '$result'" ;; esac
          done
          exit "$status"

  fuzz:
    name: fuzz (Atheris)
    # After the Hypothesis job, so that it starts from the example database that job just saved, and saves the
    # two jobs' finds together; it runs whether that job passed, failed or was skipped.
    needs: hypothesis
    # Weekly and on a manual run only: every second of fuzzing is a second billed.
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    # Five targets at the default 300 s, the control (at most 3 minutes for each of the first three targets, 15
    # for the fourth's fault of step 10, 8 for its fault in a table, 15 for its fault in a table's value, 8 for
    # the fifth's fault of an extrapolation's method, 45 for the fourth's fault over a table alternative, 16
    # on average, and 15 for build_bytes.py's fault in the declaration's check, then a replay of six property
    # modules) and the replay of the property tests. The slowest run on CI took 126.7 minutes (run 39743609131
    # of 2026-10-22, dispatched on S4d's draft, every step here among them but the declaration's: 64.1 for the
    # control, one round of the fourth's fault over a table alternative among it, by its timing, 25.4 for the
    # targets, 36.8 for the replay); the two rounds it did not run and the declaration's control add 45
    # minutes at most (`FUZZ_ADDED_SINCE`). The timeout is twice their sum, as the Hypothesis job's is of its
    # shards' slowest runs, and `tests/unit/test_ci_workflows.py` holds it there. A manual run of S seconds a
    # target adds 5 (S - 300) / 60 minutes to the targets.
    timeout-minutes: 344
    env:
      FUZZ_SECONDS: ${{ inputs.fuzz_seconds || 300 }}
      # The fuzzing and its replay run under one profile: the properties' sizes come from it, and a failure
      # replays only under the profile it was found with.
      MATERICA_HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Atheris 3.1.0 publishes wheels for Python 3.12 to 3.14 only.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group fuzz

      # Before the example database is restored, and with it removed after: the first two targets must find a
      # fault seeded in `parse`, the third one seeded in the read, the fourth one seeded in step 10 and, in
      # runs of its own, one seeded in a table, one in a table's value and one in step 7 over a table
      # alternative, the fifth one seeded in step 0's check of an extrapolation, and build_bytes.py one seeded
      # in the declaration's check (tests/fuzz/seeded_fault.py); the replay must find what the property targets
      # saved again and shrink it.
      - name: Control, the faults seeded in parse, the read, step 10, a table, a table's value, an extrapolation's method, a table alternative and the declaration's check are found, replayed and shrunk
        env:
          MATERICA_FUZZ_SEEDED_FAULT: "1"
        run: |
          control="$RUNNER_TEMP/control"
          mkdir -p "$control/findings"
          uv run python -m tests.fuzz.jsonio_bytes --seed "$control/corpus"
          uv run python -m tests.fuzz.jsonio_bytes "$control/corpus" -dict=tests/fuzz/json.dict -max_len=4096 \
            -max_total_time=180 -artifact_prefix="$control/findings/" > "$control/bytes.log" 2>&1 || true
          uv run python -m tests.fuzz.properties -max_total_time=180 -artifact_prefix="$control/findings/" \
            > "$control/properties.log" 2>&1 || true
          uv run python -m tests.fuzz.record_properties -max_total_time=180 -artifact_prefix="$control/findings/" \
            > "$control/record_properties.log" 2>&1 || true
          uv run python -m tests.fuzz.read_field_bytes --seed "$control/fields"
          uv run python -m tests.fuzz.read_field_bytes --dict "$control/value_field.dict"
          # Its fault is behind two changes to one seed: one run found it after 84 to 601 s in ten local runs, six
          # at a time (2026-10-16). Two runs side by side, each of up to 900 s, on the runner's cores: the control
          # passes where either finds it. Each run, as the weekly one, schedules slow inputs less often
          # (`-entropic_scale_per_exec_time=1`): one seed of 261 KB costs about 52 times the others' mean an
          # input, and without the flag the corpus fills with its derivatives and the target slows through a run.
          # Four local runs of 1,800 s each way, two at a time side by side (Python 3.14, 2026-10-17, S2a-4's
          # review B, M2): with the flag, 528 inputs a second and the fault found in two runs (at 510 and 516 s,
          # 0.82 finds a million inputs); without it, 237 a second and found in none. The control's runs and
          # their length are the maintainer's to set.
          for worker in 1 2; do
            cp -r "$control/fields" "$control/fields-$worker"
            uv run python -m tests.fuzz.read_field_bytes "$control/fields-$worker" \
              -dict="$control/value_field.dict" -max_total_time=900 -entropic_scale_per_exec_time=1 \
              -artifact_prefix="$control/findings/" \
              > "$control/read_field_bytes-$worker.log" 2>&1 &
          done
          wait || true
          cat "$control/read_field_bytes-1.log" "$control/read_field_bytes-2.log" > "$control/read_field_bytes.log"
          # The fault seeded in a table (`MATERICA_FUZZ_SEEDED_FAULT=tables`), one change to a seed's first knot
          # away: six local runs found it after 16, 26, 34, 57, 250 and 319 s (2026-10-20). Two runs of its own
          # side by side, as above, each of up to one and a half times the slowest find, to the minute, as the
          # 900 s above are of 601 s: the control passes where either finds it.
          for worker in 1 2; do
            cp -r "$control/fields" "$control/tables-$worker"
            MATERICA_FUZZ_SEEDED_FAULT=tables uv run python -m tests.fuzz.read_field_bytes "$control/tables-$worker" \
              -dict="$control/value_field.dict" -max_total_time=480 -entropic_scale_per_exec_time=1 \
              -artifact_prefix="$control/findings/" \
              > "$control/tables-$worker.log" 2>&1 &
          done
          wait || true
          cat "$control/tables-1.log" "$control/tables-2.log" > "$control/tables.log"
          # The fault seeded in a table's value (`MATERICA_FUZZ_SEEDED_FAULT=table_edges`): a read just above an
          # edge raises where the value above lies outside 0.6 to 1.6 times the value below, one change to a
          # value at an edge away. Ten local runs, in pairs, each of up to 900 s with these arguments, found it in
          # nine, after 65 to 725 s, and missed once (2026-10-21): a rate of 2.7e-3 a second. Two pairs side by
          # side, four runs of up to 900 s each: at that rate all four miss with about 1.1e-3 on a runner 1.4
          # times slower than the laptop, an estimate until CI's own runs measure it. The control passes where
          # any of the four finds it. The maintainer's ruling (S4) gives the fuzz controls a job of their own, a
          # runner for each pair; this pair of pairs moves there when that job is built.
          for worker in 1 2 3 4; do
            cp -r "$control/fields" "$control/table-edges-$worker"
            MATERICA_FUZZ_SEEDED_FAULT=table_edges uv run python -m tests.fuzz.read_field_bytes \
              "$control/table-edges-$worker" -dict="$control/value_field.dict" -max_total_time=900 \
              -entropic_scale_per_exec_time=1 -artifact_prefix="$control/findings/" \
              > "$control/table-edges-$worker.log" 2>&1 &
          done
          wait || true
          cat "$control"/table-edges-[1-4].log > "$control/table_edges.log"
          uv run python -m tests.fuzz.read_acceptance_bytes --seed "$control/acceptances"
          uv run python -m tests.fuzz.read_acceptance_bytes --dict "$control/acceptance.dict"
          # Fuzz target 5's fault (`MATERICA_FUZZ_SEEDED_FAULT=extrapolation_method`, S3c): an extrapolation's
          # `method` compared ignoring case at step 0, one changed letter from every seed extrapolation, none of
          # which holds it, found by the target's oracle as an extrapolation that breaks its shape not refused. Ten
          # local runs, five at a time side by side, each of up to 600 s with these arguments, found it in all ten,
          # after 7, 9, 25, 58, 84, 152, 154, 173, 174 and 482 s (Python 3.14, 2026-10-21; each find `constant`
          # with one letter's case changed): a rate of 7.6e-3 finds a second. Four runs side by side, each of up
          # to 480 s, the slowest find to the minute: at that rate all four miss with about 3e-5 on a runner 1.4
          # times slower than the laptop, an estimate until CI's own runs measure it. The control passes where any
          # of the four finds it. It moves to the fuzz controls' own job when S4's piece builds it, as the table
          # value's does.
          for worker in 1 2 3 4; do
            cp -r "$control/acceptances" "$control/method-$worker"
            MATERICA_FUZZ_SEEDED_FAULT=extrapolation_method uv run python -m tests.fuzz.read_acceptance_bytes \
              "$control/method-$worker" -dict="$control/acceptance.dict" -max_total_time=480 \
              -artifact_prefix="$control/findings/" \
              > "$control/method-$worker.log" 2>&1 &
          done
          wait || true
          cat "$control"/method-[1-4].log > "$control/extrapolation_method.log"
          # S4d's control for fuzz target 4 (`MATERICA_FUZZ_SEEDED_FAULT=table_alternatives`): a table alternative
          # read outside its readable range refusing the field where step 7 sets it aside, found by the model's
          # assertion. No seed shows it, and one change to a seed does. Ten local runs, in pairs, each of up to
          # 900 s with these arguments, found it in seven, after 125 to 866 s, and missed three times (Python 3.14,
          # 2026-10-22): a rate of 1.1e-3 finds a second. Of the two parts of the bar the maintainer's ruling sets
          # the fuzz controls, it fails the first, a find in each run within 900 s on the runner's time: three runs
          # missed, and two found it after the 643 s that 900 s are on a runner 1.4 times slower. It meets the
          # second, a weekly miss of at most 1e-3, at the rate measured, a point estimate: four runs side by side
          # all miss with about 0.06 on such a runner, and twelve with about 2e-4; at the rate's one-sided 95 %
          # lower bound, 5.2e-4 finds a second, twelve would miss with about 0.018. So a round of four runs side
          # by side, and another where none of a round found it, three rounds at most: about 16 minutes on
          # average, 45 at most. The control passes where any run finds it. The rounds stay until the maintainer
          # rules on them; the control moves to the fuzz controls' own job when S4's piece builds it.
          found="^AssertionError: the implementation gives .*'outside_range'.*, the model "
          for round in 1 2 3; do
            for worker in 1 2 3 4; do
              run=$(( (round - 1) * 4 + worker ))
              cp -r "$control/fields" "$control/table-alternatives-$run"
              MATERICA_FUZZ_SEEDED_FAULT=table_alternatives uv run python -m tests.fuzz.read_field_bytes \
                "$control/table-alternatives-$run" -dict="$control/value_field.dict" -max_total_time=900 \
                -entropic_scale_per_exec_time=1 -artifact_prefix="$control/findings/" \
                > "$control/table-alternatives-$run.log" 2>&1 &
            done
            wait || true
            cat "$control"/table-alternatives-*.log > "$control/table_alternatives.log"
            if grep -qv "the model .*'outside_range'" <(grep "$found" "$control/table_alternatives.log"); then
              break
            fi
          done
          uv run python -m tests.fuzz.build_bytes --seed "$control/declarations"
          uv run python -m tests.fuzz.build_bytes --dict "$control/declaration.dict"
          # S7a-1's control for build_bytes.py (`MATERICA_FUZZ_SEEDED_FAULT=declarations`): item 4 skipping every
          # acceptance after a model's second, so that a third without its `reason` or `basis` is refused as a
          # member missing (BC-048) where the build's reference model gives BC-005, which the target's relation
          # to the model finds: its find is the model's BC-005 at an acceptance that the implementation does not
          # give, the implementation's BC-048 there showing beside it only where the model gives none there, and
          # none at an acceptance 0 or 1, which the fault leaves alone. No seed shows it, and one change to a
          # seed does. measure.yml's fuzz kind ran it ten times (run 40263772231): each run failed on it, after
          # 28 to 63 s, four of them with the model's BC-005 alone, which a find that also asked for the
          # implementation's BC-048 read as no find; and ten times again with that find (run 40275055796), each
          # failing on it after 17 to 47 s. Until that kind measures it with this find, four runs side by side,
          # each of up to the 900 s of the bar the maintainer's ruling sets the fuzz controls, and the control
          # passes where any finds it. Their number and length are set from the rate CI measures.
          for worker in 1 2 3 4; do
            cp -r "$control/declarations" "$control/declarations-$worker"
            MATERICA_FUZZ_SEEDED_FAULT=declarations uv run python -m tests.fuzz.build_bytes \
              "$control/declarations-$worker" -dict="$control/declaration.dict" -max_total_time=900 \
              -artifact_prefix="$control/findings/" \
              > "$control/declarations-$worker.log" 2>&1 &
          done
          wait || true
          cat "$control"/declarations-[1-4].log > "$control/declarations.log"
          declared="^AssertionError: the implementation gives .*, the model .*'BC-005', '/models/[0-9]*/acceptances/[0-9]*'"
          # The fault skips acceptances 2 and after alone: the model's BC-005 at 0 or 1 is not its find.
          declared_early="the model .*'BC-005', '/models/[0-9]*/acceptances/[01]'"
          # What each run found and when, one line a run, printed before any check below can end the step:
          # `fuzz-control <name> round=<r> run=<i> found=<yes|no> seconds=<s>`, then a line a control,
          # `fuzz-control-summary <name> runs=<n> found=<k> seconds=<total> rate=<finds a second>`. A run's seconds
          # come from its own log: from the log's creation, when the shell opened it to start the run, to its last
          # write. libFuzzer stops a run at its first crash, so for a run that found the fault they are the time
          # to the find, with the interpreter's start in them; for a run that did not, they are its whole length,
          # which a rate over the runs needs. `found` is read from the log with the patterns the checks below use.
          fuzz_times="$control/find-times.txt"
          : > "$fuzz_times"
          fuzz_report() {
            local name="$1" round="$2" run="$3" log="$4" pattern="$5" except="$6" outcome=no born ended seconds
            if [ -z "$except" ]; then
              if grep -q "$pattern" "$log"; then outcome=yes; fi
            elif grep -qv "$except" <(grep "$pattern" "$log"); then
              outcome=yes
            fi
            born=$(stat -c %.9W "$log")
            ended=$(stat -c %.9Y "$log")
            seconds=unknown
            if [ "${born%%.*}" != 0 ]; then
              seconds=$(awk -v born="$born" -v ended="$ended" 'BEGIN { printf "%.1f", ended - born }')
            else
              echo "::warning::the filesystem does not record when $log was created, so its seconds are unknown"
            fi
            echo "fuzz-control $name round=$round run=$run found=$outcome seconds=$seconds" | tee -a "$fuzz_times"
          }
          summing='$2 == n { r++; f += ($5 ~ /yes/); split($6, s, "="); t += s[2] } END { print r + 0, f + 0, t + 0, (t > 0 ? f / t : 0) }'
          fuzz_runs() {
            local name="$1" side_by_side="$2" pattern="$3" except="$4" run=0 log
            shift 4
            for log in "$@"; do
              [ -e "$log" ] || continue
              run=$((run + 1))
              fuzz_report "$name" $(( (run - 1) / side_by_side + 1 )) "$run" "$log" "$pattern" "$except"
            done
            read -r runs finds total rate < <(awk -v n="$name" "$summing" "$fuzz_times")
            printf 'fuzz-control-summary %s runs=%d found=%d seconds=%.1f rate=%.2e\n' \
              "$name" "$runs" "$finds" "$total" "$rate"
          }
          seeded="IndexError: the seeded fault"
          fuzz_runs bytes 1 "$seeded in parse" "" "$control/bytes.log"
          fuzz_runs properties 1 "$seeded in parse" "" "$control/properties.log"
          fuzz_runs record_properties 1 "$seeded in the read" "" "$control/record_properties.log"
          fuzz_runs read_field_bytes 2 "$seeded in step 10" "" "$control"/read_field_bytes-[12].log
          fuzz_runs tables 2 "^AssertionError: the implementation gives .*'form_invalid'.*, the model " \
            "the model .*'form_invalid'" "$control"/tables-[12].log
          fuzz_runs table_edges 4 "ArithmeticError: the seeded fault in a table's value" "" \
            "$control"/table-edges-[1-4].log
          fuzz_runs extrapolation_method 4 "AssertionError: an extrapolation that breaks its shape not refused" "" \
            "$control"/method-[1-4].log
          mapfile -t alternatives < <(ls -v "$control"/table-alternatives-*.log 2>/dev/null)
          fuzz_runs table_alternatives 4 "$found" "the model .*'outside_range'" "${alternatives[@]}"
          fuzz_runs declarations 4 "$declared" "$declared_early" "$control"/declarations-[1-4].log
          uv run python -m pytest -p tests.fuzz.seeded_fault -q --hypothesis-show-statistics \
            tests/property/test_jsonio_properties.py tests/property/test_canonical_properties.py \
            tests/property/test_hashing_properties.py tests/property/test_read_properties.py \
            tests/property/test_model_properties.py tests/property/test_invariance_properties.py \
            > "$control/replay.log" 2>&1 || true
          # Each step and the fault it must find: the replay runs the properties of both.
          for check in "bytes:in parse" "properties:in parse" "record_properties:in the read" \
            "read_field_bytes:in step 10" "replay:in parse" "replay:in the read"; do
            log="${check%%:*}"
            fault="${check#*:}"
            if ! grep -q "IndexError: the seeded fault $fault" "$control/$log.log"; then
              tail -40 "$control/$log.log"
              echo "::error::the $log step did not find the fault seeded $fault, so it could not find a real one"
              exit 1
            fi
          done
          # The table's fault raises nothing: the model's assertion finds it, the implementation refusing a table
          # at step 8 (`form_invalid`) where the model does not.
          refused="^AssertionError: the implementation gives .*'form_invalid'.*, the model "
          if ! grep -qv "the model .*'form_invalid'" <(grep "$refused" "$control/tables.log"); then
            tail -40 "$control/tables.log"
            echo "::error::the tables runs did not find the fault seeded in a table, so they could not find a real one"
            exit 1
          fi
          # The table value's fault raises: its message is the finding.
          if ! grep -q "ArithmeticError: the seeded fault in a table's value" "$control/table_edges.log"; then
            tail -40 "$control/table_edges.log"
            echo "::error::the table_edges runs did not find the fault seeded in a table's value, so they could not find a real one"
            exit 1
          fi
          # The extrapolation method's fault raises nothing: the target's oracle finds the read going on where an
          # extrapolation breaks its shape, which step 0 must refuse.
          if ! grep -q "AssertionError: an extrapolation that breaks its shape not refused" "$control/extrapolation_method.log"; then
            tail -40 "$control/extrapolation_method.log"
            echo "::error::the extrapolation_method runs did not find the fault seeded in an extrapolation's method, so they could not find a real one"
            exit 1
          fi
          # The table alternatives' fault raises nothing: the model's assertion finds it, the implementation
          # refusing with a table alternative's `outside_range` where the model sets that table aside.
          refuses="^AssertionError: the implementation gives .*'outside_range'.*, the model "
          if ! grep -qv "the model .*'outside_range'" <(grep "$refuses" "$control/table_alternatives.log"); then
            tail -40 "$control/table_alternatives.log"
            echo "::error::the table_alternatives runs did not find the fault seeded in step 7 over a table alternative, so they could not find a real one"
            exit 1
          fi
          # The declaration check's fault raises nothing: the model's assertion finds it, the model giving BC-005
          # at an acceptance after a model's second where the implementation does not (it refuses a missing
          # `reason` or `basis` there as a member missing, BC-048).
          if ! grep -qv "$declared_early" <(grep "$declared" "$control/declarations.log"); then
            tail -40 "$control/declarations.log"
            echo "::error::the declarations runs did not find the fault seeded in the declaration's check, so they could not find a real one"
            exit 1
          fi
          # Only a stored example can fail in the reuse phase: the replay found what the fuzzing saved. Each
          # reads its lines through `<(...)`: a command that stops reading early (`grep -q`, `head`) would
          # end the one writing to it, which fails a pipe under pipefail.
          if ! grep -qE " [1-9][0-9]* failing" <(grep -A3 "during reuse phase" "$control/replay.log"); then
            echo "::error::the replay did not find the failure the fuzzing saved"
            exit 1
          fi
          head -40 <(grep -B2 -A3 -E "document=|data=|world=|shuffled=" "$control/replay.log")
          rm -rf .hypothesis

      # The databases the Hypothesis job's shards saved in this run, the latest saved where it did not run,
      # restored one over the other: their union.
      - name: Restore the example database of the json shard
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-json-${{ github.run_id }}
          restore-keys: hypothesis-${{ runner.os }}-json-
      - name: Restore the example database of the records shard
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-records-${{ github.run_id }}
          restore-keys: hypothesis-${{ runner.os }}-records-
      - name: Restore the example database of the conditions shard
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-conditions-${{ github.run_id }}
          restore-keys: hypothesis-${{ runner.os }}-conditions-
      - name: Restore the example database of the relations_1of2 shard
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-relations_1of2-${{ github.run_id }}
          restore-keys: hypothesis-${{ runner.os }}-relations_1of2-
      - name: Restore the example database of the relations_2of2 shard
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-relations_2of2-${{ github.run_id }}
          restore-keys: hypothesis-${{ runner.os }}-relations_2of2-
      # Target 1's corpus from earlier runs, so that its coverage builds up; it is seeded afresh as well.
      - name: Restore the raw-bytes corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corpus-kept
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ runner.os }}-
      - name: Fuzz raw bytes into parse (tests/fuzz/jsonio_bytes.py)
        run: |
          mkdir -p "$RUNNER_TEMP/findings" "$RUNNER_TEMP/corpus-kept"
          uv run python -m tests.fuzz.jsonio_bytes --seed "$RUNNER_TEMP/corpus"
          find "$RUNNER_TEMP/corpus-kept" -type f -exec cp -t "$RUNNER_TEMP/corpus" {} +
          uv run python -m tests.fuzz.jsonio_bytes "$RUNNER_TEMP/corpus" -dict=tests/fuzz/json.dict -max_len=4096 \
            -max_total_time="$FUZZ_SECONDS" -artifact_prefix="$RUNNER_TEMP/findings/"
      # libFuzzer keeps, in a fresh directory, only the inputs that add coverage, so the cache stays small. A
      # merge that went wrong keeps nothing, and must not replace the corpus.
      - name: Minimise the raw-bytes corpus
        id: merge
        if: success() || failure()
        run: |
          mkdir "$RUNNER_TEMP/corpus-next"
          uv run python -m tests.fuzz.jsonio_bytes -merge=1 "$RUNNER_TEMP/corpus-next" "$RUNNER_TEMP/corpus"
          if [ -z "$(ls -A "$RUNNER_TEMP/corpus-next")" ]; then
            echo "::error::the merge kept no input"
            exit 1
          fi
          echo "kept $(ls "$RUNNER_TEMP/corpus-next" | wc -l) of $(ls "$RUNNER_TEMP/corpus" | wc -l) inputs"
          rm -rf "$RUNNER_TEMP/corpus-kept"
          mv "$RUNNER_TEMP/corpus-next" "$RUNNER_TEMP/corpus-kept"
      # Saved from the path it is restored to: a cache entry is versioned by its path.
      - name: Save the raw-bytes corpus
        if: steps.merge.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corpus-kept
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
      - name: Fuzz the properties (tests/fuzz/properties.py)
        if: success() || failure()
        run: |
          mkdir -p "$RUNNER_TEMP/findings"
          uv run python -m tests.fuzz.properties -max_total_time="$FUZZ_SECONDS" -artifact_prefix="$RUNNER_TEMP/findings/"
      - name: Fuzz the record properties (tests/fuzz/record_properties.py)
        if: success() || failure()
        run: |
          mkdir -p "$RUNNER_TEMP/findings"
          uv run python -m tests.fuzz.record_properties -max_total_time="$FUZZ_SECONDS" -artifact_prefix="$RUNNER_TEMP/findings/"
      - name: Fuzz raw bytes into step 8 (tests/fuzz/read_field_bytes.py)
        if: success() || failure()
        run: |
          mkdir -p "$RUNNER_TEMP/findings"
          uv run python -m tests.fuzz.read_field_bytes --seed "$RUNNER_TEMP/fields"
          uv run python -m tests.fuzz.read_field_bytes --dict "$RUNNER_TEMP/value_field.dict"
          uv run python -m tests.fuzz.read_field_bytes "$RUNNER_TEMP/fields" -dict="$RUNNER_TEMP/value_field.dict" \
            -max_total_time="$FUZZ_SECONDS" -entropic_scale_per_exec_time=1 -artifact_prefix="$RUNNER_TEMP/findings/"
      - name: Fuzz raw bytes as an acceptance (tests/fuzz/read_acceptance_bytes.py)
        if: success() || failure()
        run: |
          mkdir -p "$RUNNER_TEMP/findings"
          uv run python -m tests.fuzz.read_acceptance_bytes --seed "$RUNNER_TEMP/acceptances"
          uv run python -m tests.fuzz.read_acceptance_bytes --dict "$RUNNER_TEMP/acceptance.dict"
          uv run python -m tests.fuzz.read_acceptance_bytes "$RUNNER_TEMP/acceptances" \
            -dict="$RUNNER_TEMP/acceptance.dict" -max_total_time="$FUZZ_SECONDS" -artifact_prefix="$RUNNER_TEMP/findings/"
      # What the property target found is in the example database: replayed first here, and shrunk. The writer
      # schema's properties and the two JSON Schema libraries' agreement are no fuzz target, and their shards
      # keep their own databases. Every mutant search, a module named `test_*mutants.py`, is derandomised and
      # keeps nothing in the example database (`MUTANT_SEARCH` in tests/property/support.py), so it has nothing
      # to replay: a rule by name, so that a new mutant module is skipped unedited. The mutant tables' checks
      # (`test_*mutant_table.py`) draw under the profile's database, and stay.
      - name: Replay and shrink what was found
        if: success() || failure()
        run: >-
          uv run pytest tests/property -n auto --dist worksteal
          --ignore=tests/property/test_writer_properties.py
          --ignore=tests/property/test_validators_agree.py
          --ignore-glob='tests/property/test_*mutants.py'
      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-findings
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
      # Both jobs' finds, under each shard's prefix: the next run of either shard, or of this job, restores them.
      - name: Save the example database for the json shard
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-json-${{ github.run_id }}-fuzz
      - name: Save the example database for the records shard
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-records-${{ github.run_id }}-fuzz
      - name: Save the example database for the conditions shard
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-conditions-${{ github.run_id }}-fuzz
      - name: Save the example database for the relations_1of2 shard
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-relations_1of2-${{ github.run_id }}-fuzz
      - name: Save the example database for the relations_2of2 shard
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-relations_2of2-${{ github.run_id }}-fuzz
