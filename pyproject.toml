[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[project]
name = "openmaterica"
version = "0.1.0.dev4"
description = "Material records for simulation, and the reader of their specification"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    # Writes src/materica/shapes.py, which CI checks byte for byte, so pinned; it does not run on Python 3.15.
    "datamodel-code-generator==0.83.0",
    "hypothesis>=6.140",
    "jsonschema>=4.26",
    # A second JSON Schema implementation (`tests/verdicts.py`); `tests/property/test_validators_agree.py` holds
    # the two to one verdict.
    "jsonschema-rs==0.58.4",
    "mypy>=1.18",
    # The reference the anomaly check's specifier syntax is held to (`tests/unit/test_check_anomalies.py`,
    # `tests/property/test_anomaly_reader_properties.py`); pytest depends on it too.
    "packaging>=24.0",
    # The release MADDENING's CI pins.
    "pyright==1.1.414",
    "pytest>=8.4",
    "pytest-xdist>=3.8",
    # Reads the workflows in tests/unit/test_ci_workflows.py, and is the reference the anomaly check's YAML
    # reader is held to (`tests/property/test_anomaly_reader_properties.py`).
    "pyyaml>=6.0",
    "rfc8785>=0.1.4",
    "ruff>=0.13",
    "types-jsonschema>=4.26",
    "types-pyyaml>=6.0",
]
# Atheris 3.1.0 publishes wheels for CPython 3.12 to 3.14 on Linux x86_64 only, and no source distribution, so
# it installs only there; `uv sync` and `uv sync --group fuzz` work everywhere else without it.
fuzz = [
    "atheris==3.1.0; sys_platform == 'linux' and platform_machine == 'x86_64' and platform_python_implementation == 'CPython' and python_version >= '3.12' and python_version < '3.15'",
]

# The distribution is `openmaterica` and the package it installs `materica`; without this, uv_build looks for
# `src/openmaterica`.
[tool.uv.build-backend]
module-name = "materica"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
# A JUnit report (`--junitxml`, as CI writes for its durations report) gives each test its file and line.
junit_family = "xunit1"
xfail_strict = true
markers = [
    "features: the least share of a property's examples that must show each feature (tests/property/audits.py)",
    "drawn: the features a property draws one of alike, each held to its draw floor (tests/property/audits.py)",
    "chances: the chance that one draw of a property shows each feature, each held to its draw floor (tests/property/audits.py)",
    "deep_chances: the chance that one draw of a property shows each feature, each held to its draw floor at the deep profile alone (tests/property/audits.py)",
    "deep_controls: an audit control of a floor held at the deep profile alone, run at that profile alone (tests/conftest.py)",
]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/materica", "tests", "scripts"]
# Development-only stubs for libraries that ship no types (pyright reads the same directory by default).
mypy_path = "typings"

[tool.pyright]
include = ["src/materica", "tests", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.ruff]
# Python only: ruff also formats code blocks in Markdown, which would rewrite the specification's examples.
include = ["*.py", "*.pyi"]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "PT"]
